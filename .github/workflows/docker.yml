# 构建并发布多架构 Docker 镜像到 GHCR（两个镜像：网关 + 验证码 sidecar）
#   - ghcr.io/sakuralaaa/zcode2api-2026.11          网关（根目录 Dockerfile）
#   - ghcr.io/sakuralaaa/zcode2api-2026.11-captcha  验证码 sidecar（captcha/Dockerfile，可选）
#   - 推送到 main：打 latest + sha-<短提交号>
#   - 推送 v* 标签：打语义化版本号（如 1.2.3 / 1.2）+ sha-<短提交号>
#   - 也可在 Actions 页手动触发（workflow_dispatch）
# 所有 action 均固定到完整 commit SHA（注释里是对应版本号），防止上游标签被篡改
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GHCR 镜像名必须全小写
          - name: gateway
            context: .
            image: ghcr.io/sakuralaaa/zcode2api-2026.11
            title: ZCode2API
            description: 智谱 ZCode 账号池管理控制台 · Anthropic / OpenAI 双协议反代网关
          - name: captcha
            context: ./captcha
            image: ghcr.io/sakuralaaa/zcode2api-2026.11-captcha
            title: ZCode2API Captcha Sidecar
            description: ZCode2API 可选验证码 sidecar · 真实浏览器运行阿里云官方 SDK 无痕验证，为领取额度铸造参数
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 QEMU（跨架构构建 arm64）
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录 GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 标注
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # 默认已带 org.opencontainers.image.source / version / revision / created 等
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: 构建并推送（linux/amd64, linux/arm64）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 两个镜像分开缓存，互不覆盖
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
